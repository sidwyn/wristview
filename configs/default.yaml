# wristview default run configuration.
# Every value here is hashed into each stage's meta.json.

device:
  # `auto` picks mps on Apple Silicon, then cuda, then cpu.
  preferred: auto
  # MPS lacks a few float64 and index kernels. Set true to fall back per op.
  allow_cpu_fallback: true

ingest:
  # The scan clip is short, so 4 fps gives too few frames to reconstruct.
  # A 30 second scan at 6 fps gives about 180, which is the working range.
  scan_fps: 6.0
  # Demo frame rate. 0 keeps the clip's native rate.
  #
  # The build plan says demos at full rate. On 60 fps source that costs more
  # than it returns: Stage 2 localizes every demo frame against the scan
  # independently, which is 1450 frames times 10 retrieved scan frames of
  # LightGlue, about four hours. Stage 3 then spends another hour on the same
  # frames.
  #
  # 20 fps still sits above the 15 Hz control rate that Stage 4 resamples to,
  # so nothing Stage 4 needs is lost, and it brings Stages 2 and 3 to about an
  # hour together. Raise it when the trajectory itself is the subject.
  demo_fps: 20
  max_scan_frames: 400
  max_demo_frames: 600
  jpeg_quality: 2
  # Blur rejection by variance of the Laplacian.
  #
  # The threshold is relative to the clip's own median sharpness, not an
  # absolute number. Laplacian variance depends on scene content as much as on
  # focus, so an absolute threshold tuned on one room throws away a different
  # share of frames in the next. A fixed 40.0 discarded 48 percent of a scan
  # that COLMAP registered at 182 of 182.
  # Seam times, in seconds, when the scan is several passes concatenated.
  # Each pass is then judged for blur against its own median sharpness.
  #
  # A close pass is soft because the lens cannot focus that near, not because
  # its frames are bad. Judged against one clip median it loses frames to the
  # sharper passes beside it, and the frames it loses are the lowest, because
  # those are the blurriest. On real26 appending a third pass raised the clip
  # median from 132.8 to 149.6 and cost the low pass 18 frames it had kept
  # before, which raised the reconstructed floor from 8.47 cm to 12.15 cm on
  # identical footage.
  #
  # null treats the scan as one pass, which is right when it is one.
  scan_pass_boundaries_s: null
  blur_relative_threshold: 0.30
  # Absolute floor for frames that are genuinely unusable, black or smeared.
  # 0 disables the absolute test.
  blur_absolute_threshold: 3.0
  # Never drop more than this share of frames to blur, however bad the clip.
  blur_max_drop_fraction: 0.15
  # Absolute blur floor for the SCAN, contrast-normalised so exposure does
  # not fool it. The relative rule above fixed the case where a scan-wide
  # threshold deleted a soft pass; it opened the opposite one, because a
  # threshold that moves down with its pass PROTECTS a pass that is
  # uniformly soft. real27's mat_pass kept 547 of 587 at a threshold of 3.0
  # and about 11 of those were worth having.
  #
  # WHICH REGION the floor judges. 1 is the whole frame. Above 1 it is the
  # sharpest tile of a square grid. Kept at 1: the region rule was tried on
  # real31 and REJECTED. It moved that session's close pass only 8.7 to 17.8
  # per cent while loosening real27's known-too-soft mat pass from 59.1 to
  # 73.1, which is the fault the floor exists to catch. See
  # `best_tile_normalised_variance` for what it is good for and what it is not.
  blur_floor_tiles: 1
  # THIS NUMBER IS PER ROOM. It is not a property of focus.
  #
  # Variance of the Laplacian scales with scene TEXTURE, which is why the
  # per-pass rule above is relative. This floor is the one absolute number
  # left, and it does not transfer between sessions.
  #
  # 0.0323 is the median of real26/d's registered views below 15 cm, shot over
  # a woven mat. real31 is a bare bamboo desk. Measured there, a pass shot IN
  # FOCUS at 1 to 3 m, beyond any depth-of-field limit, cleared 0.0323 on only
  # 31.5 per cent of its frames. A pass in focus cannot be 68 per cent
  # blurred: that is the floor reading another room's texture.
  #
  # So re-measure it per session, from a pass known to be in focus in THAT
  # room, and take roughly its 1st percentile. real31's is 0.0085. Its job is
  # to reject frames carrying no signal at all, which is what it was
  # introduced for. Judging whether a whole pass is too soft is a different
  # job that this number cannot do across rooms; Stage 1's registration rate
  # answers that one on all the data rather than a sample.
  blur_normalised_floor: 0.0323
  # Perceptual-hash Hamming distance below which two frames count as
  # duplicates. 0 disables deduplication.
  phash_min_distance: 2
  # Demos are trajectories: every frame is a distinct moment, and adjacent
  # frames at 60 fps are near-identical by nature. Deduplicating them destroys
  # the temporal resolution Stage 4 needs, so it is off.
  demo_phash_min_distance: 0
  # Reject footage wider than this horizontal field of view. Ultra-wide breaks
  # the pinhole assumption the whole pipeline rests on.
  max_horizontal_fov_deg: 100.0
  # Used only when EXIF and ARKit give nothing. A sane iPhone main-wide guess.
  fallback_focal_ratio: 0.85
  # Which COLMAP camera model Stage 1 self-calibrates. null picks
  # SIMPLE_RADIAL, whose ONE distortion term cannot describe the barrel an
  # iPhone 0.5x ultra-wide produces at about 108 degrees. Set OPENCV
  # (k1,k2,p1,p2) or OPENCV_FISHEYE (k1..k4) for an ultra-wide scan. Ignored
  # when the focal length came from a real EXIF measurement, because the
  # camera is then fixed rather than refined.
  colmap_camera_model: null
  # Find the part of a demo clip that shows the workspace.
  #
  # A take holds more than the demonstration. Session real25 opened and closed
  # with a sync clock on a monitor. Stage 2 rejected that clip: a few clock
  # frames registered against room geometry and returned wrong poses, which
  # turned a 60 cm camera path into 25.78 m.
  #
  # The detector measures the scan-match count for each frame. Marker
  # visibility was tried first and rejected: the hand covered the marker for
  # 4.25 s in the middle of a manipulation, which is longer than either sync
  # segment, so no bridge length separates the two cases.
  #
  # Detection failure raises an error. It never falls back to the whole clip.
  detect_workspace_segment: true
  workspace_samples: 24

scene:
  # `hloc` uses SuperPoint plus LightGlue. `sift` uses pycolmap only.
  matcher: hloc
  feature: superpoint_inloc
  matcher_conf: superpoint+lightglue
  # Exhaustive pairing is correct below roughly 400 frames.
  pair_mode: exhaustive
  # Pairs to match per frame beyond the temporal window. Loop closures.
  retrieval_num_matched: 12
  sequential_window: 10
  # SuperPoint keypoints per image. Matching cost scales with the square.
  max_keypoints: 1024
  # Ignore cached features and matches and recompute them.
  force_rematch: false
  min_registration_rate: 0.8
  max_reproj_error_px: 1.5
  scale:
    # arkit, aruco, manual, or none. Tried in this order when set to auto.
    source: auto
    aruco_dict: DICT_4X4_50
    # REQUIRED. No default. Measure the black square with a tape and pass it.
    #
    # A default for a physical quantity fails silently. This key held 0.15 from
    # the first commit of the project. No marker this project printed was ever
    # 150 mm. A run that forgot the override produced a reconstruction 1.5x too
    # large, and every metric number downstream inherited that.
    #
    # null makes a forgotten override a loud error instead.
    aruco_marker_length_m: null
    # Which marker sets the scale. null means the most-detected id. Averaging
    # across ids is never right: a spurious id 17 seen in 8 frames alongside
    # the genuine id 0 in 114 gave a 44 percent scale error.
    aruco_marker_id: null
    aruco_min_detections: 10
    # Metric scale from something already in the shot, when there is no ARKit
    # trajectory and no printed marker. Name it and give one real dimension.
    #
    # Diameter is the measurement to trust for anything roughly cylindrical
    # and upright: its silhouette width is the diameter from every viewpoint,
    # while silhouette height foreshortens with viewing angle. Height is used
    # only as a cross-check.
    known_object:
      prompt: "a drinking glass"
      diameter_m: 0.07
      height_m: 0.15
    # Manual scale, for footage with no ARKit trajectory and no marker.
    # Measure one real distance in the scene, read the same distance off the
    # unscaled reconstruction, and put both here. Stage 1 divides.
    manual:
      known_distance_m: null
      reconstruction_distance_units: null
      # Or set the factor directly when it is already known.
      scale_factor: null
      note: ""
    # Refuse to continue without metric scale unless this is true.
    allow_unscaled: false
  splat:
    enabled: true
    backend: mps
    iterations: 3000
    # Training resolution, long side. 540 rather than 720: it is 2.4x faster
    # per iteration and holds peak memory near 1.4 GB at 60k Gaussians, on a
    # 24 GB machine that has to share with everything else.
    resolution: 540
    sh_degree: 2
    init_points: 60000
    # Hand freed blocks back to the driver this often. The MPS caching
    # allocator never releases on its own: measured at a constant 60,000
    # Gaussians, driver memory climbed 3.59 to 6.34 GiB over 500 steps and
    # kept rising, while allocated tensor memory held at 1.02 GiB. That climb,
    # not densification, is what ran the Metal path out of memory.
    empty_cache_interval: 50
    position_lr: 0.00016
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001
    densify_from_iter: 300
    densify_until_iter: 2000
    densify_interval: 100
    # Densify the gaussians whose screen-space gradient is in the top slice
    # of the observed distribution. A quantile rather than the absolute
    # threshold below, because the absolute one does not transfer between
    # scenes: 4e-4 densified a 0.30 m desk reconstruction and selected nothing
    # at all on a 2.57 m room, leaving the splat to shrink silently.
    # Set to null to use densify_grad_threshold instead.
    densify_grad_percentile: 98.0
    densify_grad_threshold: 0.0004
    # Opacity reset is what clears floaters, the Gaussians that park a few
    # centimetres in front of a training camera and blanket any later view
    # from nearby. Disabling it has a cost that is invisible in PSNR: a
    # 3000 step run with it off left a shell of floaters within 30 cm of the
    # demo cameras, so splat-rendered depth came back pinned at the near
    # plane and Stage 3 placed the object at the camera.
    #
    # It needs room to recover, though. At 3000 total steps a reset at 1500
    # knocked every Gaussian to 0.01 opacity and PSNR fell 19.9 to 16.4 dB
    # without coming back. Upstream resets every 3000 of 30000. So: keep this
    # at 3000 and give the run enough iterations, or set 0 and accept
    # floaters near the cameras.
    opacity_reset_interval: 3000
    prune_opacity_threshold: 0.005
    max_gaussians: 400000
    tile_size: 16
    # How many Gaussians the MPS rasteriser keeps per tile. It pads each tile
    # to this and SILENTLY DROPS the rest, so a score taken from a truncated
    # render describes the cap, not the splat: real26's GPU splat read 6.39 dB
    # at 128 where gsplat put it at 30.46. The scoring guard refuses to report
    # when anything was dropped, which is why sept02_scan failed Stage 1 after
    # training successfully, having dropped 566,107 pairs.
    #
    # Raised from 128 so a room-sized scan splat can be scored at all. This is
    # a cap on a workaround, not a fix: the rasteriser is MPS-only and gsplat
    # on CUDA draws these correctly. If a scan still overflows here, score it
    # with tools/cuda_job/measure_splat.py rather than raising this further.
    max_per_tile: 3072

localize:
  # Which demos to localize. null is every demo Stage 0 ingested.
  #
  # Stage 2 is the expensive stage, roughly 12 minutes a clip on the Mac, so
  # naming one clip lets the whole path be proven before fifty takes are
  # committed to it. A run that names a subset writes a summary covering only
  # that subset and records the rest under `skipped_by_config`, so a partial
  # run cannot be mistaken for a complete one.
  clips: null
  # Below this fraction of registered frames, fall back to the ARKit trajectory.
  min_register_rate: 0.7
  # Reject the episode when more than this fraction of frames has no pose.
  max_tracking_loss: 0.02
  ransac_max_error_px: 12.0
  ransac_min_inliers: 12
  # Physical plausibility, checked because a registration rate proves nothing
  # on its own. PnP returns a pose whenever it finds enough inliers, and with
  # weak geometry those poses are individually valid and collectively
  # nonsense. On the first real footage every frame registered while the
  # camera appeared to travel 19 m in 7.8 s across a 0.53 m scene.
  max_camera_speed_m_s: 2.0
  # Median inliers over correspondences. Scan frames self-localize at 0.92;
  # demo frames that barely overlap the scan sat at 0.19.
  min_inlier_ratio: 0.35
  # Pass an implausible trajectory downstream anyway. Only for exercising the
  # later stages when the capture cannot support localization. Everything
  # produced from such an episode is geometrically invalid and says so.
  accept_implausible: false
  smoothing_window: 5
  # Scan frames to match each demo frame against. This multiplies the whole
  # stage: every extra one is another LightGlue pair per demo frame.
  retrieval_top_k: 10

estimate:
  # Which demos to estimate. null is every demo Stage 2 accepted.
  #
  # Stage 3 is about 90 minutes for 60 clips, so re-running a couple of them
  # after a code fix should cost minutes. A partial run merges into the
  # existing summary rather than replacing it, so untouched clips keep their
  # verdicts instead of vanishing.
  clips: null
  # Stop the stage when a 3D quantity does not reproject onto the observation
  # that produced it. Set false to record the failure and continue.
  fail_on_reprojection: true
  # Long side, in pixels, for the object and depth path. Rendering splat depth
  # at a demo's native 2160x1214 is 2.6 million pixels a frame and nothing
  # downstream needs it: accuracy there is set by the depth model, not by
  # pixel count. Hand estimation ignores this and runs at full resolution.
  work_resolution: 640
  # Near plane for the splat depth render, in metres. A demo or wrist camera
  # is never within this distance of real geometry, so anything nearer is a
  # floater. Culling them matters: at 0.02 m the render came back fully
  # saturated at the near plane and the object was placed at the camera.
  depth_near_m: 0.3
  hand:
    # wilor, hamer, mediapipe, or auto.
    # auto order: WiLoR, then HaMeR, then MediaPipe. WiLoR is the one that
    # holds the fingers on the object through a wrapped grasp. HaMeR does not
    # install on Apple Silicon. meta.json records which one actually ran.
    backend: auto
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    max_hands: 1
    # Metric length of the index finger MCP to wrist bone. Scales MediaPipe's
    # unitless hand model into metres.
    hand_scale_m: 0.095
    # Which hand to follow: largest, Left or Right.
    #
    # "largest" takes the biggest detection box each frame. It suits a clip
    # with one acting hand, and it breaks when two hands act at once, because
    # the nearer hand is the larger one and the selection crosses between them.
    #
    # Naming a side follows that hand and ignores the other, which makes a
    # two-handed clip usable as a single-arm episode. It needs the WiLoR
    # backend, which reports handedness. Frames where the wanted hand is not
    # detected, or where two detections claim it, become gaps.
    select: largest
    # Per-clip override, keyed by clip id: {select: Right}
    per_clip: {}
  object:
    # groundingdino_sam2, or color. `auto` tries the models, then falls back.
    backend: auto
    # Name the object, do not describe its shape.
    #
    # Grounding DINO scores a phrase against the image and this pipeline takes
    # the single highest box, so a generic phrase invites it to lock onto the
    # wrong thing and to change its mind mid-clip. Session 6 prompted for a
    # shape and it tracked the bin, which nobody moved.
    #
    # real27's object is a cream cardboard carton with black kanji and a red
    # stamp, on a white printed mat. Contrast against the mat is low, which is
    # where segmentation will fail if it fails. Name the material and colour,
    # not the geometry.
    prompt: "cream cardboard tea box"
    box_threshold: 0.3
    text_threshold: 0.25
    # Frames between Grounding DINO re-detections. In between, SAM 2 tracks
    # from the previous mask's centroid, which is faster and steadier than
    # re-detecting every frame.
    detect_interval: 15
    # Fraction of the frame the object mask may occupy before it is rejected.
    max_mask_fraction: 0.4
    min_mask_pixels: 400
  depth:
    # depth_anything_v2, sparse, or auto.
    backend: auto
    model_id: depth-anything/Depth-Anything-V2-Small-hf
    input_size: 518
  pose:
    # The object's real height, measured with a ruler, in metres. Together with
    # the desk plane from Stage 1 this is the only scale input the object pose
    # needs, and it replaces the monocular depth path entirely. Set to 0 to
    # fall back to depth, which is what floated session 4's cube 85 mm above a
    # desk it was resting on while reporting a 1.1 mm residual.
    # Measure the object every session. Do not inherit it.
    #
    # This read 0.0762 from the first commit, which is exactly 3 inches: a
    # stale value from an earlier cube. It is 8.9 per cent larger than the real
    # object, and because the plane solve places the centre at
    # `offset + height / 2` a wrong height moves the object as well as sizing
    # it. Nothing complains, because a cube of the wrong size on a desk still
    # sits on the desk.
    # The VERTICAL extent, in metres. The plane solve places the object's
    # centre at `offset + object_height_m / 2`, so this is the one number that
    # moves the object along the viewing ray if it is wrong.
    # sept02: Sidwyn's cube, measured 75 mm on each side. The 0.070 before
    # this was real27's matcha carton, inherited rather than measured --
    # the exact failure the comment above warns about.
    object_height_m: 0.075
    # The rendered body as [x, y, z] in the object frame, in metres.
    #
    # z is the vertical one. `plane.object_pose_on_plane` builds the frame as
    # [axis, normal x axis, normal], so the third axis is the desk normal, and
    # z must equal object_height_m. The code raises if they disagree, because
    # the error is a silent vertical float of half the difference.
    #
    # null falls back to a cube of object_height_m, which is right only for a
    # cube. real27's object is a matcha carton, 60 x 60 x 70 mm.
    object_dimensions_m: [0.075, 0.075, 0.075]
    # Per clip, because one set can hold several objects and different clips
    # manipulate different ones. Session 6 proved the need: with a single
    # prompt the detector locked onto the bin, which nobody ever moved.
    per_clip: {}
    # What happens once the object is picked up.
    #
    # The plane solve above pins the object's centre to `offset + height / 2`,
    # so the tracked object cannot rise. Session 6 clip 5 sat at 2.000 cm on all
    # 185 valid frames, spread 0.0000 mm, while the hand reached 24.7 cm. That
    # is right until contact and wrong for the whole carry, and it reached the
    # surface as grasp detection finding 0 of 186 frames.
    carry:
      enabled: true
      # The object is at rest while its plane-solved position stops moving.
      # Asking instead whether the hand is far from the object does not work:
      # during a carry the plane solve leaves the object on the desk while the
      # hand is in the air, so every carried frame looks clear. Session 6
      # clip 1 admitted 336 of 338 frames that way, with 7.36 cm of scatter.
      rest_stillness_m: 0.01
      min_rest_frames: 5
      # Fingertip-to-surface gap that starts a grasp, measured against the
      # resting position, which is the one position known to be right.
      contact_margin_m: 0.03
      min_contact_frames: 3
      # Release is disagreement, not distance: while the object is held, the
      # silhouette ray and the hand point at the same place. This is how far
      # apart they may drift before the object is judged to be out of the hand.
      release_ray_m: 0.06
      release_frames: 3
    # Trim this fraction of the worst-fitting points before each rigid fit.
    icp_trim_fraction: 0.2
    icp_iterations: 20
    smoothing_window: 5

retarget:
  # Retarget only part of a clip, as [start, end) frame indices.
  #
  # Use it when a take holds motion outside the demonstration. Measure the
  # boundary from the content, not from where a gate stops complaining: the
  # grasp detector gives the release frame and the hand detector gives the
  # entry frame.
  #
  # The excluded frames are still checked. Their gate results are reported
  # under `excluded_tail` in the status, so a bad segment cannot vanish by
  # being trimmed away.
  frame_range: null
  urdf: ""
  # Used when no URDF is given. Metres.
  gripper:
    max_width_m: 0.085
    min_width_m: 0.0
    finger_length_m: 0.055
    palm_depth_m: 0.06
  grasp:
    # contact = fingertip-to-object distance plus a stable hand-to-object
    # relative pose. width = the old thumb-to-index test, kept only for
    # comparison. Width scored 57.9% against ground truth on a handle grasp.
    method: contact
    # Half the object's largest dimension. Measured from the segmented object
    # cloud where one exists.
    # Half the object's largest dimension: 75 mm cube -> 0.0375.
    object_radius_m: 0.0375
    contact_margin_m: 0.03
    release_margin_m: 0.05
    # How still the object must sit in the hand frame to count as carried.
    stability_tol_m: 0.02
    # Derive the open and closed thresholds from each episode's own width
    # distribution. A wrapped grasp on a drinking glass holds the thumb and
    # index about 5.8 cm apart while a small block closes under 4 cm, so one
    # pair of fixed distances cannot serve both, and the failure is silent:
    # the trigger never latches. The metres below are the fallback for a clip
    # whose hand barely changes shape.
    auto_threshold: true
    # Thumb tip to index tip distance below which the hand may be grasping.
    close_distance_m: 0.070
    open_distance_m: 0.095
    # Fingertip to object surface distance for a contact candidate.
    contact_distance_m: 0.05
    # Cosine similarity between hand and object velocity that confirms carrying.
    motion_coupling_threshold: 0.6
    min_object_speed_m_s: 0.02
    # Hysteresis. A state change must hold this many frames to be accepted.
    min_state_frames: 3
  # Offset from the thumb-index midpoint along the palm normal, in metres.
  # A real gripper's jaws sit behind the fingertips.
  origin_offset_m: 0.02
  smoothing_window: 7
  # Published datasets span 3 Hz to 50 Hz.
  control_rate_hz: 15.0

render:
  width: 640
  height: 480
  # `control` renders one frame per control sample, which is what pairs with
  # an action. `video` renders every demo frame, which is four times the work
  # at 60 fps input and 15 Hz control.
  sample_rate: control
  # 0 means no cap. Set a small number for a quick look.
  max_frames: 0
  # Wrist camera pose relative to the end-effector frame.
  # Translation in metres, rotation as roll, pitch, yaw in degrees.
  # A fixed camera mount in the gripper frame, aimed at the point the fingers
  # close on. Not derived from hand anatomy: the approach axis of a hand
  # wrapped around a mug is horizontal, and a camera pointed along it looks
  # across the desk rather than at the object.
  #
  # Tune mount_back_m and mount_up_m for the rig; raise aim_ahead_m to push
  # the finger tips further down the frame.
  wrist_camera:
    mount_back_m: 0.10      # behind the finger tips, along -z
    mount_up_m: 0.10        # above the jaw line, along -y
    aim_ahead_m: 0.14       # look this far beyond the finger tips
    grasp_offset_m: 0.02    # finger tips ahead of the gripper origin, matches retarget.origin_offset_m
    # Matches the wrist camera this project actually recorded. Measured from
    # its calibration, wrist_K.npy at 1280x720: fx 1062.5, fy 943.6, which is
    # 62.1 degrees horizontal and 41.8 vertical. It was 90.0, which is 28
    # degrees wider than the real lens and spends a third of the frame on room
    # the scan never reconstructed. On real27full, narrowing to 62.1 and
    # pitching the mount raised median pixel coverage from 0.379 to 0.551 and
    # took the clips clearing 0.50 from 2 of 30 to 18 of 30.
    fov_deg: 62.1
    # Pitch the camera down about its own right axis, after aiming. Position is
    # unchanged, so this does not move the viewpoint and cannot affect the
    # coverage gate.
    #
    # The mount puts the finger tips 22.38 degrees below the optical axis, and
    # that angle is fixed by mount_back_m and mount_up_m; standoff_m scales the
    # whole mount and leaves it alone. At 90 degrees the vertical half-angle is
    # 29.4, so the tips were inside the frame. At 62.1 it is 18.7, so without
    # pitch they fall off the bottom entirely and the gripper leaves the
    # picture.
    pitch_down_deg: 12.02
    # Where the finger tips should land, as a fraction of frame height. This is
    # not decoration: `mount.fingertip_row_fraction` computes the delivered
    # value and `tests/test_mount_framing.py` fails when the two disagree.
    #
    # It exists because the comment above these keys claimed 77 per cent for
    # months while the code delivered 86.6, and nothing compared them.
    framing_row_fraction: 0.77
    # REQUIRED. How far the camera sits from the finger tips, in metres.
    # No default and no fallback: the rig decides this, not the code.
    #
    # 0.25 m is the UMI placement. It was raised to 0.35 m once as a workaround
    # for an 18 cm scan floor, which traded framing for coverage. real26/bm's
    # floor is 8.47 cm, so that workaround is retired. Do not raise this to
    # hide a scan that does not reach low enough.
    standoff_m: 0.25
  # Render even when the wrist camera looks from viewpoints the scan never
  # covered. The render is then extrapolation, not interpolation. Say so
  # wherever the video is shown.
  allow_extrapolation: false
  # Load the splat layer from a directory rendered elsewhere, instead of
  # rasterising it here. Set to the output of tools/cuda_job/render_wrist.py.
  # The local MPS rasteriser drops Gaussians past a per-tile cap and does not
  # say so, which makes it unusable above a few hundred thousand Gaussians.
  # null renders locally.
  splat_layer_dir: null
  # Target deployment camera model. `pinhole` or `fisheye`.
  camera_model: fisheye
  # OpenCV fisheye k1 to k4. Mild barrel distortion by default.
  fisheye_coeffs: [-0.08, 0.01, 0.0, 0.0]
  near_plane_m: 0.02
  far_plane_m: 12.0
  background_rgb: [0.05, 0.05, 0.06]
  draw_gripper: true
  draw_object: true
  write_preview_video: true
  preview_fps: 15

# --- Stage 6, export -------------------------------------------------------
export:
  # Which clips enter the dataset. null means every clip Stage 5 rendered.
  #
  # Naming clips explicitly, rather than filtering on a metric here, keeps the
  # REASON a clip was excluded in the run record instead of in a threshold.
  # real31 rendered 28 clips of which 11 have a hand-identity crossing that
  # Stage 3 calls INVALID: "the largest-box selector crossed between two hands
  # mid-episode, and the result will look smooth while describing neither
  # hand." Those render fine and must not be trained on.
  clips: null
  # The LeRobotDataset repo id. null gives wristview/<run_id>.
  repo_id: null
  # Folder holding the REAL wrist frames for arm C, one subfolder per clip,
  # written by tools/extract_wrist_real.py. Required: every episode must carry
  # all three cameras or A', B' and C would read different rows.
  wrist_real_root: null
